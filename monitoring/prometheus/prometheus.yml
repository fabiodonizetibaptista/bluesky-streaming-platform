global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: flink
    metrics_path: /metrics
    static_configs:
      - targets:
          - 127.0.0.1:9249
          - 127.0.0.1:9250
          - 127.0.0.1:9251

  - job_name: prometheus
    static_configs:
      - targets:
          - 127.0.0.1:9090
