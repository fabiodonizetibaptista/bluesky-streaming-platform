[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "realtime-social-streaming"
version = "0.1.0"
description = "Real-time Bluesky event streaming with Kafka"
requires-python = ">=3.11"
dependencies = [
    "confluent-kafka==2.16.0",
    "websockets==16.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]


[project.optional-dependencies]
ml = [
    "numpy>=2,<3",
    "scikit-learn>=1.7,<2",
    "joblib>=1,<2",
]
dev = [
    "pytest>=8,<10",
]
